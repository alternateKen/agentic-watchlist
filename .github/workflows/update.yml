name: Update agentic watchlist

on:
  schedule:
    # GitHub starts scheduled runs LATE (hours late on this repo) and skips some, so a late run must still
    # build: there is no clock check any more. The cron times are written wide (UTC, no daylight saving):
    #   10:15 and 11:15 UTC = pre-market (6:15am New York in summer / winter; the other is a harmless extra)
    #   every 30 minutes from 13:00 to 21:59 UTC covers US market hours in both summer and winter time
    - cron: "15 10,11 * * 1-5"
    - cron: "5,35 13-21 * * 1-5"
  workflow_dispatch: {}   # lets you press "Run workflow" for an on-demand refresh
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", "watchlist.txt", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fresh watchlist data
        timeout-minutes: 7
        run: python scripts/fetch_watchlist.py docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
